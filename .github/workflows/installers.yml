name: Installer checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    strategy:
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Parse POSIX installer
        run: sh -n install.sh

  powershell:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
