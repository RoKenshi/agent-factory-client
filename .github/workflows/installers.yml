name: Installer checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    strategy:
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Parse POSIX installer
        run: sh -n install.sh && sh -n uninstall.sh
      - name: Check pinned release keys
        run: python3 tests/test_pinned_release_key.py
      - name: Test complete release-bundle verification
        run: python3 -m unittest tests/test_release_bundle.py
      - name: Test signed POSIX installation
        run: sh tests/test_install.sh

  powershell:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./uninstall.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Check pinned release keys
        shell: pwsh
        run: python tests/test_pinned_release_key.py
      - name: Test complete release-bundle verification
        shell: pwsh
        run: python -m unittest tests/test_release_bundle.py
      - name: Test signed PowerShell installation
        shell: pwsh
        run: ./tests/test_install.ps1
