name: Installation problem
description: Report a public, non-sensitive installation or startup problem
title: "[install] "
body:
  - type: markdown
    attributes:
      value: Never include provider keys, activation keys, source code, paths, or private logs.
  - type: input
    id: version
    attributes:
      label: Agent Factory version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux x86-64, Linux ARM64, Windows x86-64, macOS Intel, macOS Apple Silicon]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Sanitized problem description
    validations:
      required: true
